name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check . ../evals
          uv run ruff format --check . ../evals
      - name: Tests
        run: uv run pytest
